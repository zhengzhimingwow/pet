<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e6">
  <title>企鹅大乐斗</title>
  <script>
    const page = new URLSearchParams(location.search);
    if (page.has('online') || !page.has('demo')) document.documentElement.classList.add('online-entry');
  </script>
  <link rel="preload" href="assets/qq-penguin-side-idle.png" as="image">
  <link rel="preload" href="assets/qq-penguin-pan-poses.png" as="image">
  <link rel="stylesheet" href="style.css?v=town-login">
</head>
<body>
  <main id="account-entry" class="account-entry" hidden>
    <div class="entry-frame">
      <div class="town-art">
        <img src="assets/penguin-town.webp" alt="蓝围巾和红围巾企鹅在海边小镇散步">
        <div class="town-brand"><span class="brand-icon" aria-hidden="true">✦</span><h1>企鹅大乐斗</h1></div>
      </div>
      <section class="entry-panel" aria-label="游戏入口">
        <div id="account-login">
          <h2>欢迎回家</h2>
          <p class="entry-copy">登录账号，回到你的企鹅小镇。</p>
          <form id="online-login" class="login-form">
            <label for="login-account">账号</label>
            <input id="login-account" name="username" autocomplete="username" required maxlength="32" pattern="[A-Za-z0-9_]+" placeholder="请输入账号">
            <label for="login-password">密码</label>
            <div class="password-field">
              <input id="login-password" name="password" type="password" required maxlength="128" autocomplete="current-password" placeholder="请输入密码">
              <button id="password-visibility" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
            </div>
            <label for="login-zone">区服</label>
            <select id="login-zone" name="zone"><option value="1">1 服</option><option value="2">2 服</option></select>
            <button id="login-submit" class="entry-button" type="submit">登录游戏 <span aria-hidden="true">→</span></button>
          </form>
          <a class="entry-demo" href="?demo=pan">试玩战斗演示 <span aria-hidden="true">↗</span></a>
        </div>
        <div id="account-lobby" hidden>
          <h2>企鹅小镇</h2>
          <p id="online-player" class="entry-copy"></p>
          <div class="lobby-actions">
            <button id="enter-arena" class="entry-button" type="button">进入竞技场 <span aria-hidden="true">→</span></button>
            <button id="online-logout" class="entry-demo" type="button">退出登录</button>
          </div>
        </div>
        <p id="account-feedback" role="status"></p>
      </section>
    </div>
  </main>
  <main id="game-shell" class="shell">
    <header class="top">
      <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><strong>企鹅大乐斗</strong></div>
      <nav class="mode-nav" aria-label="出招模式">
        <a href="?online" id="online-link">联机对战</a>
        <a href="?demo=pan" data-mode="pan">平底锅</a>
        <a href="?demo=blade" data-mode="blade">青龙偃月刀</a>
        <a href="?demo=sword" data-mode="sword">轩辕剑</a>
        <a href="?demo=normal" data-mode="normal">随机出招</a>
      </nav>
    </header>

    <section id="online-panel" class="online-panel" aria-label="联机挑战" hidden>
      <div id="online-session" hidden>
        <button id="back-lobby" class="sound-toggle" type="button">返回小镇</button>
        <form id="online-challenge" class="online-form">
          <label>对手区服 <select id="target-zone"><option value="1">1 服</option><option value="2">2 服</option></select></label>
          <label>角色编号 <input id="target-player" required maxlength="32" pattern="[a-zA-Z0-9]+"></label>
          <button id="challenge" class="sound-toggle" type="submit">挑战</button>
        </form>
        <details>
          <summary>历史战报</summary>
          <ul id="battle-history"></ul>
        </details>
      </div>
      <p id="online-feedback" role="status"></p>
    </section>

    <section class="game" aria-labelledby="arena-title">
      <div class="game-head">
        <div><h1 id="arena-title">欢乐竞技场</h1><span class="demo-label" id="demo-label">随机出招</span></div>
        <div class="head-actions">
          <button class="sound-toggle" id="music-toggle" type="button" aria-pressed="true" aria-label="背景音乐">♫ 音乐开</button>
          <button class="sound-toggle" id="sound" type="button" aria-pressed="true" aria-label="关闭音效">🔊 音效开</button>
          <button class="sound-toggle" id="speed-toggle" type="button" aria-pressed="false" aria-label="战斗倍速">倍速 1×</button>
          <button class="sound-toggle" id="skip" type="button" hidden>跳过战斗</button>
          <span class="round" id="round">准备开战</span>
        </div>
      </div>
      <div class="arena" id="arena">
        <div class="arena-scenery" aria-hidden="true">
          <div class="ridge"></div><div class="meadow"></div><div class="sand-ring"></div>
        </div>
        <div class="fighter left" id="left">
          <div class="shadow"></div>
          <div class="fighter-art fighter-art-left" role="img" aria-label="蓝围巾企鹅小团子"></div>
          <div class="floating" id="float-left"></div>
        </div>
        <div class="vs" aria-hidden="true">VS</div>
        <div class="fighter right" id="right">
          <div class="shadow"></div>
          <div class="fighter-art fighter-art-right" role="img" aria-label="红围巾企鹅大壮"></div>
          <div class="floating" id="float-right"></div>
        </div>
        <div class="dust" id="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="impact" id="impact" aria-hidden="true">
          <span>✦</span>
          <div class="impact-sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <h2 id="winner"></h2>
            <p id="result-text"></p>
            <button id="again" type="button">再来一场 ↗</button>
          </div>
        </div>
      </div>

      <div class="status-row">
        <div class="status">
          <div class="status-title"><div><span class="avatar" aria-hidden="true"></span><b id="name-left">小团子</b><em>Lv. 5</em></div><strong id="hp-left-text">100 / 100</strong></div>
          <div class="bar"><div class="bar-ghost"></div><div class="bar-fill" id="hp-left"></div></div>
        </div>
        <div class="status status-right">
          <div class="status-title"><div><span class="avatar" aria-hidden="true"></span><b id="name-right">大壮</b><em>Lv. 5</em></div><strong id="hp-right-text">100 / 100</strong></div>
          <div class="bar"><div class="bar-ghost"></div><div class="bar-fill" id="hp-right"></div></div>
        </div>
      </div>
    </section>

    <section class="bottom" aria-label="战斗操作与记录">
      <div class="log-panel">
        <h2>战斗实况</h2>
        <div class="logs" id="logs" aria-live="polite"><p class="empty">开战后，招式和伤害会显示在这里。</p></div>
        <details id="damage-stats" hidden><summary>伤害统计</summary><ul id="damage-totals"></ul></details>
      </div>
      <div class="action-panel">
        <div><h2 id="action-title">准备就绪</h2><p id="action-desc">双方轮流随机出招。</p></div>
        <button class="start" id="start" type="button">开始战斗 <span aria-hidden="true">↗</span></button>
      </div>
    </section>
  </main>
  <audio id="arena-music" src="assets/arena-theme.m4a" preload="none" loop></audio>
  <script src="game.js?v=town-login"></script>
  <script src="online.js?v=town-login"></script>
</body>
</html>
